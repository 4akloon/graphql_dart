"A user role."
enum Role {
  ADMIN
  EDITOR
  VIEWER @deprecated(reason: "Use EDITOR.")
}

enum Unused {
  A
}

scalar DateTime

scalar Cursor

input UserFilter {
  role: Role
  name: String = "x"
  ids: [ID!]!
  nested: UserFilter
  since: DateTime
  matrix: [[Int]]
}

input SearchBy @oneOf {
  name: String
  id: ID
  ids: [ID!]
}

"Names that Dart reserves or that the generated class already has."
input Paging {
  default: Int
  other: String!
  after: Cursor
  client: Int
}

input Unreached {
  value: Int
}

interface Node {
  id: ID!
}

type User implements Node {
  id: ID!
  name: String!
  role: Role!
  createdAt: DateTime
  cursor: Cursor
  friends(first: Int): [User!]!
}

type Bot implements Node {
  id: ID!
  model: String
}

union SearchResult = User | Bot

type Query {
  user(id: ID!): User
  node(id: ID!): Node
  search(by: SearchBy!, filter: UserFilter, paging: Paging): [SearchResult!]!
}

type Mutation {
  renameUser(id: ID!, name: String!): User
  search(by: SearchBy!, filter: UserFilter, tags: [String!]): [SearchResult!]!
}

type Subscription {
  userChanged(id: ID!): User
}
